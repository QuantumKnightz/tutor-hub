<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Tutor Hub{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <a class="brand" href="{{ url_for('home') }}">
                <span class="brand-mark">TH</span>
                <span>Tutor Hub</span>
            </a>

            <nav class="sidebar-nav" aria-label="Main navigation">
                <a
                    href="{{ url_for('home') }}"
                    class="nav-link {% if request.endpoint == 'home' %}active{% endif %}"
                    {% if request.endpoint == 'home' %}aria-current="page"{% endif %}
                >
                    Dashboard
                </a>

                <a
                    href="{{ url_for('students') }}"
                    class="nav-link {% if request.endpoint == 'students' %}active{% endif %}"
                    {% if request.endpoint == 'students' %}aria-current="page"{% endif %}
                >
                    Students
                </a>
                <a
                    href="{{ url_for('sessions') }}"
                    class="nav-link {% if request.endpoint == 'sessions' %}active{% endif %}"
                    {% if request.endpoint == 'sessions' %}aria-current="page"{% endif %}
                >
                    Sessions
                </a>
            </nav>

            <div class="sidebar-bottom">
                <span class="sidebar-label">Tutor workspace</span>
                <p>Keep every lesson organised.</p>
            </div>
        </aside>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
