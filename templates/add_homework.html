{% extends "base.html" %}

{% block title %}Assign Homework | Tutor Hub{% endblock %}

{% block content %}
<section class="page-heading">
    <div>
        <p class="eyebrow">New assignment</p>
        <h1>Assign homework</h1>
        <p>Give a student a clear task to complete before the due date.</p>
    </div>
</section>

<section class="content-section">
    <form class="form-card" method="post">
        {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
        <div class="form-group">
            <label for="student_id">Student</label>
            <select id="student_id" name="student_id" required>
                <option value="">Choose a student</option>
                {% for student in students %}
                    <option value="{{ student['id'] }}">{{ student['name'] }} · {{ student['grade'] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="title">Homework title</label>
            <input id="title" name="title" type="text" placeholder="Grade 9 textbook — page 121" required>
        </div>
        <div class="form-group">
            <label for="description">Instructions</label>
            <textarea id="description" name="description" placeholder="Tell the student exactly what to complete..." required></textarea>
        </div>
        <div class="form-group">
            <label for="due_date">Due date</label>
            <input id="due_date" name="due_date" type="date" required>
        </div>
        <div class="form-actions">
            <a href="{{ url_for('homework') }}" class="secondary-button">Cancel</a>
            <button type="submit" class="primary-button">Assign homework</button>
        </div>
    </form>
</section>
{% endblock %}
